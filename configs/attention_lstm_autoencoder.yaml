# Adapter defaults for a NEW run, not the teammate's actual training config.
method: attention_lstm_autoencoder
seed: 42
data:
  root: data/processed/meter_csvs
  input_view_directory: data/processed/attention_lstm_autoencoder/august_input_view
  cache_directory: data/processed/attention_lstm_autoencoder/august_cache
  extensions: [.csv]
  timestamp_column: timestamp
  features: [powerFactor, pRealKw, pRealPositiveKw, pRealNegativeKw, pReactiveKw, pReactivePositiveKw, pReactiveNegativeKw, vRMSMin, vRMSMax, iRMSMin, iRMSMax]
  frequency: 5min
  window_size: 288
  stride: 3
  score_block_size: 3
  read_chunk_rows: 50000
  shard_rows: 20000
  max_interpolation_gap: 3
  max_missing_ratio: 0.1
  scaler_max_rows: 1000000
  max_series_span_rows: 10000000
  meter_limit: null
  series_id_regex: null
  verify_shards: true
  keep_staging: false
splits:
  timezone: Australia/Sydney
  train_end: "2026-08-01"
  test_start: "2026-08-01"
  test_end: "2026-09-01"
  validation_ratio: 0.15
  calibration_ratio: 0.15
model:
  hidden_size: 64
  latent_size: 24
  num_layers: 1
  dropout: 0.1
training:
  epochs: 40
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.00001
  patience: 7
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  mixed_precision: true
  gradient_clip: 1.0
  threshold_quantile: 0.995
  calibration_max_scores: 1000000
  checkpoint_steps: 1000
  checkpoint_seconds: 600
  keep_epoch_checkpoints: true
  keep_shard_checkpoints: true
  calibrate_shard_checkpoints: false
  predict_after_training: true
  device: auto
output:
  directory: runs/attention_lstm_autoencoder/training/aligned_august
