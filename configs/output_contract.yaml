version: 1
timezone: Australia/Sydney
interval_minutes: 15
test_start_inclusive: "2026-08-01"
test_end_exclusive: "2026-09-01"

calibration:
  source: train_only
  end_exclusive: "2026-08-01"
  percentile_range: [0.0, 1.0]
  update_during_test: false

required_score_fields:
  - model
  - series_id
  - interval_start
  - interval_end
  - raw_score
  - max_score
  - mean_score
  - score_std
  - max_percentile
  - mean_percentile
  - threshold
  - is_anomaly
  - coverage_ratio
  - source_resolution_minutes
  - aggregation_method
  - data_status
  - calibration_version
  - available

matrix_profile:
  native_resolution_minutes: 30
  canonical_view: repeat_to_15min
  required_data_status: upsampled_from_30m

event_fields:
  - model
  - event_id
  - series_id
  - start
  - end
  - duration_minutes
  - max_raw_score
  - mean_raw_score
  - max_score_percentile
  - threshold
  - interval_count
  - calibration_version

# Review annotations are sidecars, not new model scores or verified labels.
review_sidecars:
  join_keys: [model, series_id, interval_start]
  interval_minutes: 15
  event_join_keys: [model, event_id]
  event_time_fields: [start, end]
  queues: [priority_alert, operating_change_review, data_quality]
  nullable_interval_fields:
    - source_formal_event_overlap
    - priority_alert_overlap
    - operating_change_review_overlap
    - data_quality_overlap
    - priority_core_minutes
  csv_flag_encoding: "True / False / empty; import flags as nullable boolean"
  evidence_resolution_minutes: 5
  matrix_profile_score_resolution_minutes: 30
  no_source_event_is_normal: false
  unavailable_score_annotation: null
  overwrite_model_is_anomaly: false

# Separate comparison outputs: not inputs to the existing frozen ensemble.
non_frozen_model_sidecars:
  lof:
    mode: batch_outlier_detection
    native_resolution_minutes: 5
    aligned_interval_minutes: 15
    join_keys: [model, series_id, interval_start]
    raw_score: max_score
    score_std_ddof: 0
    anomaly_rule: any_available_native_point_flagged
    coverage_ratio: valid_point_count / 3
    unavailable_anomaly_flag: null
    max_percentile: null
    mean_percentile: null
    calibration_version: lof_batch_not_frozen_v1
    ensemble_eligible: false
    native_event_semantics: consecutive_5m_flags_without_gap_bridging
    aligned_event_semantics: occupied_15m_bins_not_continuous_fault_duration

# Frozen independent variants are not silently registered as additional voters.
independent_model_sidecars:
  attention_lstm_autoencoder:
    architecture: lstm_autoencoder_with_temporal_attention_and_gelu
    native_resolution_minutes: 5
    interval_minutes: 15
    window_points: 288
    stride_points: 3
    score_tail_points: 3
    calibration_source: held_out_calibration
    calibration_version: original_model_binding
    training_cutoff_field: training_end_exclusive
    approximation_field: calibration_approximate
    unavailable_anomaly_flag: null
    missing_context: unavailable_not_zero_filled
    join_keys: [model, series_id, interval_start]
    event_join_keys: [model, event_id]
    ensemble_eligible: false
